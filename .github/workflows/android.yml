name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          mv templates/* "$tdir/"
          ls "$tdir" | head -30

      - name: Editor settings (Android SDK + Java)
        run: |
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > "$HOME/.config/godot/$f" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
            sed -i 's/^          //' "$HOME/.config/godot/$f"
          done
          cat "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: AdMob Android library (Poing Studios plugin)
        run: |
          set -e
          wget -q https://github.com/poingstudios/godot-admob-plugin/releases/download/v5.1.0/android-template-v${GODOT_VERSION}.zip -O admob-android.zip
          mkdir -p addons/admob/android/bin
          unzip -q -o admob-android.zip "ads/*" -d addons/admob/android/bin
          ls -R addons/admob/android/bin | head

      - name: Import project
        run: |
          ./godot --headless --path . --import || true
          ./godot --headless --path . --import || true

      - name: Balance smoke test (AI vs AI)
        run: ./godot --headless --path . --script res://tools/sim.gd -- --n=1 --lvl=12

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "EXPORT_MODE=release" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building a debug-signed APK"
            # fixed debug key (ci/debug.p12) so every debug APK installs over the previous one
            keytool -importkeystore -noprompt -srckeystore ci/debug.p12 -srcstoretype PKCS12 -srcstorepass android \
              -destkeystore "$RUNNER_TEMP/debug.keystore" -deststoretype JKS -deststorepass android -destkeypass android -alias androiddebugkey
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
            echo "EXPORT_MODE=debug" >> "$GITHUB_ENV"
          fi

      - name: Export APK
        run: |
          mkdir -p build
          ./godot --headless --path . --install-android-build-template --export-$EXPORT_MODE "Android" build/vo-lam-quyet-dau.apk
          # Play Store bundle from the same preset
          sed -i 's|^gradle_build/export_format=0|gradle_build/export_format=1|' export_presets.cfg
          ./godot --headless --path . --install-android-build-template --export-$EXPORT_MODE "Android" build/vo-lam-quyet-dau.aab
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: vo-lam-quyet-dau-apk
          path: build/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vo-lam-quyet-dau-aab
          path: build/*.aab
