name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_ios:
        description: "Also upload the signed IPA to TestFlight / App Store Connect"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2"
      APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID || 'WGZYDZH4KR' }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install Godot and export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tdir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q templates.tpz
          mv templates/* "$tdir/"
          test -f "$tdir/ios.zip"
          rm templates.tpz
          ls -la "$tdir"

      # Signing: the team-wide Apple Distribution certificate (.p12) and the
      # "App Store" profile for com.trungsmail.volamquyetdau. Without them the
      # job only exports the Xcode project (a compile check of the export).
      - name: Signing setup
        id: signing
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          if [ -z "$IOS_DIST_P12_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] || [ -z "$APPSTORE_TEAM_ID" ]; then
            echo "::warning::iOS signing secrets not set - exporting the Xcode project only, no .ipa"
            sed -i '' 's|^application/export_project_only=false|application/export_project_only=true|' export_presets.cfg
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          name=$(/usr/libexec/PlistBuddy -c "Print :Name" profile.plist)
          appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist)
          echo "Profile: $name ($uuid) for $appid"
          if [ "$appid" != "${APPSTORE_TEAM_ID}.com.trungsmail.volamquyetdau" ]; then
            echo "::error::profile is for $appid, expected ${APPSTORE_TEAM_ID}.com.trungsmail.volamquyetdau"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          sed -i '' \
            -e "s|^application/app_store_team_id=.*|application/app_store_team_id=\"$APPSTORE_TEAM_ID\"|" \
            -e "s|^application/provisioning_profile_uuid_release=.*|application/provisioning_profile_uuid_release=\"$uuid\"|" \
            export_presets.cfg
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: steps.signing.outputs.configured == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}

      - name: Import project
        run: |
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import || true

      # Godot writes the Xcode project, then runs xcodebuild archive and
      # -exportArchive itself (manual signing from the preset).
      - name: Export iOS
        shell: bash
        run: |
          set -e
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/vo-lam-quyet-dau.ipa 2>&1 | tee export.log
          ls -la build/ios
          plist=$(ls build/ios/vo-lam-quyet-dau/vo-lam-quyet-dau-Info.plist 2>/dev/null || true)
          [ -n "$plist" ] && plutil -p "$plist" | grep -E "Orientation|FullScreen|Version|Identifier|DisplayName|NonExempt" -A0 || true
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            test -f build/ios/vo-lam-quyet-dau.ipa
          fi

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: vo-lam-quyet-dau-ipa
          path: build/ios/*.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-export-log
          path: export.log

      - name: Upload to TestFlight
        if: steps.signing.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_ios == true
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -e
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_KEY_P8" | base64 -d > ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          xcrun altool --upload-app -f build/ios/vo-lam-quyet-dau.ipa -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"
